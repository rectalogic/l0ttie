[workspace]
members = ["xtask"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[package]
name = "l0ttie"
edition.workspace = true
license.workspace = true
version = "0.3.0"

[lib]
crate-type = ["cdylib"]

[workspace.dependencies]
anyhow = "1.0.101"

[features]
log = ["dotlottie-rs/tvg-log"]

[dependencies]
frei0r-rs2 = { git = "https://github.com/rectalogic/frei0r-rs.git", tag = "3.0.0" }
anyhow = { workspace = true }
dotlottie-rs = { git = "https://github.com/LottieFiles/dotlottie-rs.git", tag = "v0.1.57", default-features = false, features = [
    "dotlottie",
    "state-machines",
    "tvg",
    "tvg-sw",
    "tvg-threads",
    "tvg-simd",
    "tvg-lottie-expressions",
    "tvg-png",
    "tvg-jpg",
    "tvg-webp",
    "tvg-ttf",
] }
ureq = "3.0.12"
job_processor = { git = "https://github.com/rectalogic/job_processor.git", tag = "0.1.0" }
